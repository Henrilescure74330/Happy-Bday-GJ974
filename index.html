<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Gérald, 45 ans</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&display=swap">
<style>
:root{--paper:#fbf3df;--ink:#1b1720;--sun:#ffd23f;--lava:#ef4b3f;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:"Comic Neue","Comic Sans MS",sans-serif;font-weight:700;
 background-image:radial-gradient(rgba(27,23,32,.09) 1.2px,transparent 1.3px);background-size:9px 9px;
 display:grid;place-items:center;min-height:100vh;padding:24px 16px}
.card{width:100%;max-width:420px;background:#fff;border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:28px 24px;display:flex;flex-direction:column;gap:16px;text-align:center}
h1{font-family:"Bangers",Impact,sans-serif;font-weight:400;font-size:2.6rem;letter-spacing:.04em;margin:0;color:var(--lava);-webkit-text-stroke:1.5px var(--ink);line-height:1}
p{margin:0;font-size:1.05rem}
label{font-size:1rem;text-align:left}
input{font:inherit;font-size:1.15rem;padding:10px 12px;border:3px solid var(--ink);width:100%}
input:focus-visible{outline:3px dashed var(--lava);outline-offset:3px}
button{font-family:"Bangers",Impact,sans-serif;font-size:1.5rem;letter-spacing:.05em;background:var(--sun);color:var(--ink);border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:8px 18px;cursor:pointer}
button:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.err{color:var(--lava);min-height:1.3em}
</style>
</head>
<body>
<form class="card" id="f">
  <h1>Top secret !</h1>
  <p>Une BD spéciale attend Gérald. Entre le mot de passe pour l'ouvrir.</p>
  <label for="pw">Mot de passe</label>
  <input id="pw" type="password" autocomplete="current-password" autofocus required>
  <button type="submit">Ouvrir la BD</button>
  <p class="err" id="err" aria-live="polite"></p>
</form>
